name: uth
description: "Uth: an offline alarm clock you cannot dismiss half asleep. Solve math, shake, scan a code or retype a sentence."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.5.0
  sensors_plus: ^7.1.1
  theme:
    path: ../theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo-1024.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/logo_background-1024.png"
  adaptive_icon_foreground: "assets/icon/logo_foreground-1024.png"
